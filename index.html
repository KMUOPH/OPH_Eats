<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>眼科訂餐</title>
    
    <!-- ================= App 圖示設定 ================= -->
    <link rel="icon" href="logoi.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="logoi.jpg">
    <link rel="apple-touch-icon" sizes="152x152" href="logoi.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="logoi.jpg">
    <link rel="apple-touch-icon" sizes="167x167" href="logoi.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #f2f5f8; padding: 20px 0; font-family: "微軟正黑體", sans-serif; }
      .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: none; }
      .form-label { font-weight: bold; color: #495057; margin-bottom: 8px; }
      
      .text-theme { color: #40587f !important; }
      .btn-theme { background-color: #40587f; border-color: #40587f; color: white; }
      .btn-theme:hover, .btn-theme:focus { background-color: #304260; border-color: #304260; color: white; }
      
      .btn-outline-theme { color: #40587f; border-color: #40587f; margin: 2px; border-radius: 5px !important; }
      .btn-outline-theme:hover { background-color: #e2e8f0; color: #40587f; }
      .btn-check:checked + .btn-outline-theme { background-color: #40587f; color: white; border-color: #40587f; }
      
      #loadingScreen, #closedScreen { text-align: center; padding: 40px 20px; }
      .menu-img { width: 100%; border-radius: 10px; margin-bottom: 15px; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card p-4">
            
            <h3 class="text-center mb-3 text-theme">
              <img src="logoi.jpg" alt="Logo" style="height: 35px; vertical-align: middle; margin-right: 10px; border-radius: 5px;">
              OPH Eats 眼科訂餐系統
            </h3>
            
            <div id="loadingScreen">
              <div class="spinner-border text-theme" role="status"></div>
              <h5 class="mt-3 text-secondary">連線中，請稍候...</h5>
            </div>

            <div id="closedScreen" class="d-none">
              <h2 class="text-danger fw-bold mb-3">⛔ 今日點餐已關閉</h2>
              <p class="text-secondary">目前不在開放點餐時間，請稍後再試或洽詢管理員。</p>
            </div>
            
            <div id="mainContent" class="d-none">
              <div id="menuArea">
                <img id="bentoMenuImg" class="menu-img" alt="今日便當菜單">
                <img id="drinkMenuImg" class="menu-img" alt="今日飲料菜單">
              </div>

              <hr class="my-4">

              <form id="orderForm">
                <!-- 動態診次按鈕容器 -->
                <div class="mb-4">
                  <label class="form-label d-block">🏥 診次</label>
                  <div class="btn-group flex-wrap w-100" role="group" id="clinicGroup"></div>
                </div>

                <!-- 動態職級按鈕容器 -->
                <div class="mb-4" id="rankDiv">
                  <label class="form-label d-block">🧑‍⚕️ 職級</label>
                  <div class="btn-group flex-wrap w-100" role="group" id="rankGroup"></div>
                </div>

                <!-- 姓名 (非診間) -->
                <div class="mb-4 d-none" id="nameDiv">
                  <label class="form-label">👤 姓名</label>
                  <input type="text" class="form-control" id="name" placeholder="請輸入姓名">
                </div>

                <!-- 便當區 -->
                <div class="row mb-3">
                  <div class="col-8">
                    <label class="form-label">🍱 便當品項</label>
                    <input type="text" class="form-control" id="bentoItem" placeholder="例如：烤肉飯">
                  </div>
                  <div class="col-4">
                    <label class="form-label">金額</label>
                    <input type="number" class="form-control" id="bentoAmount" placeholder="0">
                  </div>
                </div>

                <!-- 飲料區 -->
                <div class="row mb-3">
                  <div class="col-8">
                    <label class="form-label">🥤 飲料品項</label>
                    <input type="text" class="form-control" id="drinkItem" placeholder="例如：春芽冷露">
                  </div>
                  <div class="col-4">
                    <label class="form-label">金額</label>
                    <input type="number" class="form-control" id="drinkAmount" placeholder="0">
                  </div>
                </div>
                
                <!-- 備註 -->
                <div class="mb-4">
                  <label class="form-label">📝 備註</label>
                  <input type="text" class="form-control" id="notes" placeholder="其他需求...">
                </div>

                <div class="d-grid">
                  <button type="button" class="btn btn-theme btn-lg fw-bold" id="submitBtn" onclick="submitOrder()">送出訂單</button>
                </div>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>

    <script>
      const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxCYuW1EjxLHqBvppXBlEKs2jXMdUJ7k7qIclgarxQpjlpk5N1j4UDcvCVHpkts2jKJ/exec";

      window.onload = function() {
        fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: "getSystemData" })
        })
        .then(res => res.json())
        .then(response => {
          document.getElementById('loadingScreen').classList.add('d-none');
          
          if(response.success && response.data.isOpen) {
            document.getElementById('mainContent').classList.remove('d-none');
            
            // 1. 圖片渲染
            if(response.data.bentoMenuUrl) {
              const bImg = document.getElementById('bentoMenuImg');
              bImg.src = response.data.bentoMenuUrl;
              bImg.style.display = 'block';
            }
            if(response.data.drinkMenuUrl) {
              const dImg = document.getElementById('drinkMenuImg');
              dImg.src = response.data.drinkMenuUrl;
              dImg.style.display = 'block';
            }

            // 2. 動態生成診次單選鈕
            const clinicContainer = document.getElementById('clinicGroup');
            clinicContainer.innerHTML = '';
            response.data.clinics.forEach((c, idx) => {
              clinicContainer.innerHTML += `
                <input type="radio" class="btn-check clinic-radio" name="clinic" id="c_${idx}" value="${c}" onchange="toggleRankName()">
                <label class="btn btn-outline-theme" for="c_${idx}">${c}</label>
              `;
            });

            // 3. 動態生成職級單選鈕
            const rankContainer = document.getElementById('rankGroup');
            rankContainer.innerHTML = '';
            response.data.ranks.forEach((r, idx) => {
              rankContainer.innerHTML += `
                <input type="radio" class="btn-check rank-radio" name="rank" id="r_${idx}" value="${r}">
                <label class="btn btn-outline-theme" for="r_${idx}">${r}</label>
              `;
            });

          } else {
            document.getElementById('closedScreen').classList.remove('d-none');
          }
        })
        .catch(err => {
          alert("網路連線錯誤，無法取得系統狀態。");
        });
      };

      function toggleRankName() {
        const clinicRadio = document.querySelector('input[name="clinic"]:checked');
        const clinic = clinicRadio ? clinicRadio.value : "";
        const rankDiv = document.getElementById('rankDiv');
        const nameDiv = document.getElementById('nameDiv');
        
        if (clinic === "非診間") {
          rankDiv.classList.add('d-none');
          nameDiv.classList.remove('d-none');
        } else {
          rankDiv.classList.remove('d-none');
          nameDiv.classList.add('d-none');
        }
      }

      function submitOrder() {
        const clinicRadio = document.querySelector('input[name="clinic"]:checked');
        const rankRadio = document.querySelector('input[name="rank"]:checked');
        const clinic = clinicRadio ? clinicRadio.value : "";
        const rank = rankRadio ? rankRadio.value : "";
        const name = document.getElementById('name').value.trim();
        
        if(!clinic) { alert("⚠️ 請選擇診次！"); return; }
        if(clinic === "非診間" && !name) { alert("⚠️ 請填寫姓名！"); return; }
        if(clinic !== "非診間" && !rank) { alert("⚠️ 請選擇職級！"); return; }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 處理中...';

        const orderData = {
          clinic: clinic, rank: rank, name: name,
          bentoItem: document.getElementById('bentoItem').value,
          bentoAmount: document.getElementById('bentoAmount').value,
          drinkItem: document.getElementById('drinkItem').value,
          drinkAmount: document.getElementById('drinkAmount').value,
          notes: document.getElementById('notes').value
        };

        fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: "submitOrder", data: orderData })
        })
        .then(response => response.json())
        .then(data => {
          if(data.success) {
            alert(data.message);
            document.getElementById('orderForm').reset();
            document.querySelectorAll('.btn-check').forEach(radio => radio.checked = false);
            toggleRankName();
          } else {
            alert("❌ 發生錯誤：" + data.message);
          }
        })
        .catch(error => alert("❌ 網路連線錯誤：" + error))
        .finally(() => {
          btn.disabled = false;
          btn.innerText = '送出訂單';
        });
      }
    </script>
  </body>
</html>
