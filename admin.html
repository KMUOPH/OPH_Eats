<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- ⚠️ 加入了 maximum-scale=1.0, user-scalable=no 來鎖定畫面，解決放大縮不回來的問題 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>訂餐系統維護</title>
  
  <!-- ================= App 圖示設定 ================= -->
  <link rel="icon" href="logoa.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="logoa.jpg">
  <link rel="apple-touch-icon" sizes="152x152" href="logoa.jpg">
  <link rel="apple-touch-icon" sizes="180x180" href="logoa.jpg">
  <link rel="apple-touch-icon" sizes="167x167" href="logoa.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f2f5f8; padding: 0; padding-bottom: 20px; font-family: "微軟正黑體", sans-serif; }
    .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: none; overflow: hidden; }
    .text-theme { color: #9b727a !important; }
    .btn-theme { background-color: #9b727a; color: white; border-color: #9b727a; }
    .btn-theme:hover { background-color: #846068; color: white; border-color: #846068; }
    
    .tag-item { display: inline-block; background: #f3ebec; color: #9b727a; padding: 5px 10px; border-radius: 8px; margin: 4px; font-weight: 500; border: 1px solid #d8c5c8;}
    .tag-action { cursor: pointer; color: #846068; padding: 0 4px; font-size: 0.9em;}
    .tag-action:hover { color: #9b727a; font-weight: bold;}
    .tag-close { cursor: pointer; margin-left: 6px; font-weight: bold; color: #dc3545; }
    #adminPanel { display: none; }
    
    #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; color: white; flex-direction: column; }
    .file-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
    
    /* 橫幅樣式：完美自動排版，永不重疊 */
    .banner-header { background-color: #9b727a; color: white; height: 65px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; display: flex; justify-content: space-between; align-items: center; padding-right: 15px; }
  </style>
</head>
<body>
  
  <div id="overlay">
    <div class="spinner-border text-light mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
    <h4 id="overlayText">處理中，請稍候...</h4>
  </div>

  <!-- 滿版橫幅：Logo等高、自動對齊 -->
  <div class="banner-header">
    <div class="d-flex align-items-center h-100 overflow-hidden">
      <img src="logo.jpg" alt="Logo" style="height: 100%; object-fit: cover; margin-right: 10px;">
      <h3 class="mb-0 fw-bold text-truncate" style="font-size: 1.25rem;">OPH Eats 眼科訂餐維護</h3>
    </div>
    <button class="btn btn-sm text-white flex-shrink-0 ms-2" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); border-radius: 15px; padding: 4px 10px; font-size: 0.85rem; font-weight: bold;" onclick="location.reload()">重新整理</button>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4">
          
          <div id="loginSection">
            <input type="password" id="adminPwd" class="form-control mb-3" placeholder="請輸入管理員密碼">
            <button class="btn btn-theme w-100 fw-bold" onclick="login()">登入</button>
          </div>

          <div id="adminPanel">
            
            <div class="card mb-4 border-primary">
              <div class="card-body text-center">
                <h5 class="card-title mb-3">今日點餐系統狀態</h5>
                <button class="btn btn-success me-2" onclick="toggleSys(true)">✅ 開放點餐</button>
                <button class="btn btn-danger" onclick="toggleSys(false)">⛔ 關閉點餐</button>
              </div>
            </div>

            <div class="card mb-4 border-secondary">
              <div class="card-body">
                <h5 class="card-title mb-3 text-secondary">📅 設定今日菜單</h5>
                
                <ul class="nav nav-tabs mb-3" id="menuTabs" role="tablist">
                  <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-select">從圖庫挑選</button></li>
                  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-upload">拍照並套用</button></li>
                </ul>
                
                <div class="tab-content">
                  <div class="tab-pane fade show active" id="tab-select">
                    <button class="btn btn-sm btn-outline-secondary mb-3 w-100" onclick="loadDriveFiles()">🔄 重新整理圖庫清單</button>
                    <label class="form-label fw-bold">🍱 餐點</label>
                    <div class="input-group mb-3">
                      <select class="form-select" id="bentoSelect"><option value="">載入中...</option></select>
                      <button class="btn btn-outline-primary" onclick="setMenu('bento')">套用</button>
                    </div>
                    <label class="form-label fw-bold">🥤 飲料</label>
                    <div class="input-group">
                      <select class="form-select" id="drinkSelect"><option value="">載入中...</option></select>
                      <button class="btn btn-outline-primary" onclick="setMenu('drink')">套用</button>
                    </div>
                  </div>

                  <div class="tab-pane fade" id="tab-upload">
                    <label class="form-label fw-bold">🍱 拍攝餐點菜單</label>
                    <div class="input-group mb-3">
                      <input type="text" class="form-control" id="bentoFileName" placeholder="店家(如:老紀)">
                      <input type="file" class="form-control" id="bentoFile" accept="image/*">
                      <button class="btn btn-success" onclick="processAndUpload('bento', true)">套用</button>
                    </div>
                    <label class="form-label fw-bold">🥤 拍攝飲料菜單</label>
                    <div class="input-group">
                      <input type="text" class="form-control" id="drinkFileName" placeholder="店家(如:五十嵐)">
                      <input type="file" class="form-control" id="drinkFile" accept="image/*">
                      <button class="btn btn-success" onclick="processAndUpload('drink', true)">套用</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="card mb-4 border-info">
              <div class="card-body">
                <h5 class="card-title mb-3 text-info">📁 菜單圖庫管理</h5>
                <p class="text-muted small mb-3">僅維護檔案，不影響今日點餐畫面。</p>
                
                <div class="input-group mb-3">
                  <select class="form-select" style="max-width: 100px;" id="libPrefix">
                    <option value="[餐點]">[餐點]</option><option value="[飲料]">[飲料]</option>
                  </select>
                  <input type="text" class="form-control" id="libFileName" placeholder="輸入店家名稱">
                  <input type="file" class="form-control" id="libFile" accept="image/*">
                  <button class="btn btn-info text-white" onclick="uploadToLibrary()">上傳</button>
                </div>
                
                <hr>
                <div class="fw-bold mb-2">現有檔案列表：</div>
                <div id="fileListContainer" style="max-height: 200px; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 5px;">
                  <div class="p-2 text-muted small">請先點擊上方「重新整理圖庫清單」</div>
                </div>
              </div>
            </div>

            <button class="btn btn-outline-secondary w-100 mb-2 fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#optionsCollapse">
              ⚙️ 展開/收合 診次與職級設定
            </button>
            <div class="collapse" id="optionsCollapse">
              <div class="card card-body mb-4 bg-light">
                <label class="form-label fw-bold">🏥 診次清單</label>
                <div id="clinicTags" class="mb-2"></div>
                <div class="input-group mb-3">
                  <input type="text" class="form-control" id="newClinicInput" placeholder="新增診次">
                  <button class="btn btn-outline-primary" onclick="addOption('clinic')">新增</button>
                </div>

                <label class="form-label fw-bold">🧑‍⚕️ 職級清單</label>
                <div id="rankTags" class="mb-2"></div>
                <div class="input-group mb-3">
                  <input type="text" class="form-control" id="newRankInput" placeholder="新增職級">
                  <button class="btn btn-outline-primary" onclick="addOption('rank')">新增</button>
                </div>
                <button class="btn btn-secondary w-100" onclick="saveOptions()">💾 儲存選單設定</button>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxCYuW1EjxLHqBvppXBlEKs2jXMdUJ7k7qIclgarxQpjlpk5N1j4UDcvCVHpkts2jKJ/exec"; 
    let currentPwd = ""; let clinicsList = []; let ranksList = []; let currentDriveFiles = [];

    function showLoading(text) { document.getElementById('overlayText').innerText = text; document.getElementById('overlay').style.display = 'flex'; }
    function hideLoading() { document.getElementById('overlay').style.display = 'none'; }

    function apiCall(payload, successMsg, callback) {
      fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(res => res.json()).then(data => { hideLoading(); if(data.success) { if(successMsg) alert(successMsg); if(callback) callback(data); } else alert("❌ 錯誤：" + data.message); })
      .catch(err => { hideLoading(); alert("網路錯誤：" + err); });
    }

    function login() {
      currentPwd = document.getElementById('adminPwd').value; showLoading("登入驗證中...");
      apiCall({ action: "adminLogin", password: currentPwd }, null, () => {
        document.getElementById('loginSection').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block';
        loadCurrentOptions(); loadDriveFiles(); 
      });
    }

    function loadDriveFiles() {
      showLoading("讀取圖庫中...");
      apiCall({ action: "getDriveFiles", password: currentPwd }, null, (res) => {
        currentDriveFiles = res.files;
        let bentoHtml = '<option value="">-- 請選擇餐點菜單 --</option>'; let drinkHtml = '<option value="">-- 請選擇飲料菜單 --</option>'; let listHtml = '';
        currentDriveFiles.forEach(f => {
          const opt = `<option value="${f.url}">${f.name}</option>`;
          if (f.name.startsWith('[餐點]')) bentoHtml += opt; else if (f.name.startsWith('[飲料]')) drinkHtml += opt; else { bentoHtml += opt; drinkHtml += opt; }
          listHtml += `<div class="file-list-item"><span class="text-truncate" style="max-width: 70%;">${f.name}</span><button class="btn btn-sm btn-outline-danger" onclick="deleteMenuFile('${f.id}', '${f.name}')">刪除</button></div>`;
        });
        document.getElementById('bentoSelect').innerHTML = bentoHtml; document.getElementById('drinkSelect').innerHTML = drinkHtml;
        document.getElementById('fileListContainer').innerHTML = listHtml || '<div class="p-2 text-muted">目前沒有檔案</div>';
      });
    }

    function setMenu(type) {
      const select = document.getElementById(type + 'Select');
      const url = select.value; if(!url) return alert("請選擇圖片！");
      const text = select.options[select.selectedIndex].text;
      const shopName = text.replace(/^\[.*?\]/, '').replace(/_\d+\.jpg$/, '');
      showLoading("套用設定中..."); 
      apiCall({ action: "setMenuUrl", menuType: type, url: url, shopName: shopName, password: currentPwd }, "✅ 菜單已套用！");
    }

    function processAndUpload(type, isSetToToday) {
      const fileInput = document.getElementById(type + 'File'); const nameInput = document.getElementById(type + 'FileName');
      if (!nameInput.value.trim()) return alert("⚠️ 請輸入店家名稱！"); if (!fileInput.files[0]) return alert("⚠️ 請選擇圖片！");
      const file = fileInput.files[0]; const prefix = type === 'bento' ? '[餐點]' : '[飲料]';
      const shopName = nameInput.value.trim();
      const finalFilename = `${prefix}${shopName}_${new Date().getTime()}.jpg`;
      
      showLoading("照片壓縮與上傳中...");
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas'); let width = img.width, height = img.height; const MAX_SIZE = 1200;
          if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
          canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          apiCall({ action: isSetToToday ? "uploadMenu" : "uploadOnly", menuType: type, filename: finalFilename, image: canvas.toDataURL('image/jpeg', 0.8), shopName: shopName, password: currentPwd }, isSetToToday ? "✅ 照片上傳並套用成功！" : "✅ 檔案已上傳至圖庫！", () => { fileInput.value = ""; nameInput.value = ""; loadDriveFiles(); });
        }; img.src = e.target.result;
      }; reader.readAsDataURL(file);
    }

    function uploadToLibrary() {
      const prefix = document.getElementById('libPrefix').value; const type = prefix === '[餐點]' ? 'bento' : 'drink';
      document.getElementById(type + 'FileName').value = document.getElementById('libFileName').value;
      document.getElementById(type + 'File').files = document.getElementById('libFile').files;
      processAndUpload(type, false);
      document.getElementById('libFileName').value = ""; document.getElementById('libFile').value = "";
    }

    function deleteMenuFile(fileId, fileName) {
      if(!confirm(`確定要刪除「${fileName}」嗎？`)) return; showLoading("刪除中...");
      apiCall({ action: "deleteFile", fileId: fileId, password: currentPwd }, null, () => loadDriveFiles());
    }

    function loadCurrentOptions() { apiCall({ action: "getSystemData" }, null, (res) => { clinicsList = res.data.clinics || []; ranksList = res.data.ranks || []; renderTags(); }); }
    function renderTags() {
      const buildTags = (arr, type) => arr.map((item, i) => `<span class="tag-item"><span class="tag-action" onclick="moveOption('${type}', ${i}, -1)">◀</span>${item}<span class="tag-action" onclick="moveOption('${type}', ${i}, 1)">▶</span><span class="tag-close" onclick="removeOption('${type}', ${i})">&times;</span></span>`).join('');
      document.getElementById('clinicTags').innerHTML = buildTags(clinicsList, 'clinic'); document.getElementById('rankTags').innerHTML = buildTags(ranksList, 'rank');
    }
    function moveOption(type, idx, dir) { const arr = type === 'clinic' ? clinicsList : ranksList; if (dir === -1 && idx > 0) [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]]; else if (dir === 1 && idx < arr.length - 1) [arr[idx], arr[idx+1]] = [arr[idx+1], arr[idx]]; renderTags(); }
    function addOption(type) { const input = document.getElementById(type === 'clinic' ? 'newClinicInput' : 'newRankInput'); if (!input.value.trim()) return; (type === 'clinic' ? clinicsList : ranksList).push(input.value.trim()); input.value = ''; renderTags(); }
    function removeOption(type, index) { (type === 'clinic' ? clinicsList : ranksList).splice(index, 1); renderTags(); }
    function saveOptions() { showLoading("儲存設定中..."); apiCall({ action: "updateOptions", clinics: clinicsList, ranks: ranksList, password: currentPwd }, "✅ 選單設定已儲存！"); }
    function toggleSys(isOpen) { if(!confirm(`確定要${isOpen ? '開放' : '關閉'}系統嗎？`)) return; showLoading("設定中..."); apiCall({ action: "toggleSystem", status: isOpen, password: currentPwd }, null, (data) => alert(data.message)); }
  </script>
</body>
</html>
