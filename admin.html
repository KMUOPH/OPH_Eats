<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPH Eats - 維護者後台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f2f5f8; padding: 20px 0; font-family: "微軟正黑體", sans-serif; }
    .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: none; }
    .text-theme { color: #40587f !important; }
    .btn-theme { background-color: #40587f; color: white; }
    .btn-theme:hover { background-color: #304260; color: white; }
    
    /* 標籤樣式優化 */
    .tag-item { display: inline-block; background: #e2e8f0; color: #40587f; padding: 5px 10px; border-radius: 8px; margin: 4px; font-weight: 500; border: 1px solid #cbd5e1;}
    .tag-action { cursor: pointer; color: #64748b; padding: 0 4px; font-size: 0.9em;}
    .tag-action:hover { color: #40587f; font-weight: bold;}
    .tag-close { cursor: pointer; margin-left: 6px; font-weight: bold; color: #dc3545; }
    
    #adminPanel { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4">
          <h3 class="text-center mb-4 text-theme">⚙️ OPH Eats 管理後台</h3>
          
          <div id="loginSection">
            <input type="password" id="adminPwd" class="form-control mb-3" placeholder="請輸入管理員密碼">
            <button class="btn btn-theme w-100" onclick="login()">登入</button>
          </div>

          <div id="adminPanel">
            
            <div class="card mb-4 border-primary">
              <div class="card-body text-center">
                <h5 class="card-title mb-3">今日點餐系統狀態</h5>
                <button class="btn btn-success me-2" onclick="toggleSys(true)">✅ 開放點餐</button>
                <button class="btn btn-danger" onclick="toggleSys(false)">⛔ 關閉點餐</button>
              </div>
            </div>

            <!-- 菜單選取區 -->
            <div class="card mb-4 border-secondary">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h5 class="card-title m-0">選擇今日菜單</h5>
                  <button class="btn btn-sm btn-outline-secondary" onclick="loadDriveFiles()">🔄 重新整理清單</button>
                </div>
                <p class="text-muted small">系統已自動連結您的 Google 雲端硬碟菜單資料夾。</p>
                
                <label class="form-label fw-bold">🍱 便當菜單</label>
                <div class="input-group mb-3">
                  <select class="form-select" id="bentoSelect"><option value="">載入中...</option></select>
                  <button class="btn btn-outline-primary" onclick="setMenu('bento')">套用</button>
                </div>
                
                <label class="form-label fw-bold mt-2">🥤 飲料菜單</label>
                <div class="input-group">
                  <select class="form-select" id="drinkSelect"><option value="">載入中...</option></select>
                  <button class="btn btn-outline-primary" onclick="setMenu('drink')">套用</button>
                </div>
              </div>
            </div>

            <!-- 動態選單管理區 -->
            <div class="card mb-4 border-info">
              <div class="card-body">
                <h5 class="card-title mb-3">🏷️ 診次與職級選單設定</h5>
                
                <label class="form-label fw-bold">🏥 診次清單 (使用箭頭調整順序)</label>
                <div id="clinicTags" class="mb-2"></div>
                <div class="input-group mb-3">
                  <input type="text" class="form-control" id="newClinicInput" placeholder="新增診次，例如：7診">
                  <button class="btn btn-outline-primary" onclick="addOption('clinic')">新增</button>
                </div>

                <label class="form-label fw-bold">🧑‍⚕️ 職級清單 (使用箭頭調整順序)</label>
                <div id="rankTags" class="mb-2"></div>
                <div class="input-group mb-3">
                  <input type="text" class="form-control" id="newRankInput" placeholder="新增職級，例如：實習醫師">
                  <button class="btn btn-outline-primary" onclick="addOption('rank')">新增</button>
                </div>

                <div class="d-grid mt-3">
                  <button class="btn btn-theme" onclick="saveOptions()">💾 儲存並套用選單設定</button>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 貼上您重新部署拿到的最新網址
    const GAS_API_URL = "您的_Google_Apps_Script_部署網址_貼在這裡"; 
    
    let currentPwd = "";
    let clinicsList = [];
    let ranksList = [];

    function apiCall(payload, successMsg, callback) {
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if(data.success) {
          if(successMsg) alert(successMsg);
          if(callback) callback(data);
        } else alert("❌ 錯誤：" + data.message);
      })
      .catch(err => alert("網路錯誤：" + err));
    }

    function login() {
      currentPwd = document.getElementById('adminPwd').value;
      apiCall({ action: "adminLogin", password: currentPwd }, "✅ 登入成功！", () => {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadCurrentOptions();
        loadDriveFiles(); // 登入後自動載入雲端硬碟檔案
      });
    }

    // --- 雲端硬碟菜單選擇 ---
    function loadDriveFiles() {
      const bSelect = document.getElementById('bentoSelect');
      const dSelect = document.getElementById('drinkSelect');
      bSelect.innerHTML = '<option value="">讀取雲端硬碟中...</option>';
      dSelect.innerHTML = '<option value="">讀取雲端硬碟中...</option>';
      
      apiCall({ action: "getDriveFiles", password: currentPwd }, null, (res) => {
        let optionsHtml = '<option value="">-- 請選擇菜單圖片 --</option>';
        res.files.forEach(f => {
          optionsHtml += `<option value="${f.url}">${f.name}</option>`;
        });
        bSelect.innerHTML = optionsHtml;
        dSelect.innerHTML = optionsHtml;
      });
    }

    function setMenu(type) {
      const select = document.getElementById(type + 'Select');
      const url = select.value;
      if(!url) { alert("請先選擇一個圖片！"); return; }
      
      apiCall({
        action: "setMenuUrl", menuType: type, url: url, password: currentPwd
      }, "✅ 菜單已套用！前端頁面將顯示此圖片。");
    }

    // --- 選單排序與編輯 ---
    function loadCurrentOptions() {
      apiCall({ action: "getSystemData" }, null, (res) => {
        clinicsList = res.data.clinics || [];
        ranksList = res.data.ranks || [];
        renderTags();
      });
    }

    function renderTags() {
      const buildTags = (arr, type) => arr.map((item, i) => `
        <span class="tag-item">
          <span class="tag-action" onclick="moveOption('${type}', ${i}, -1)" title="往前移">◀</span>
          ${item}
          <span class="tag-action" onclick="moveOption('${type}', ${i}, 1)" title="往後移">▶</span>
          <span class="tag-close" onclick="removeOption('${type}', ${i})">&times;</span>
        </span>
      `).join('');
      
      document.getElementById('clinicTags').innerHTML = buildTags(clinicsList, 'clinic');
      document.getElementById('rankTags').innerHTML = buildTags(ranksList, 'rank');
    }

    // 新增的移動排序功能
    function moveOption(type, idx, direction) {
      const arr = type === 'clinic' ? clinicsList : ranksList;
      if (direction === -1 && idx > 0) { // 往前
        [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
      } else if (direction === 1 && idx < arr.length - 1) { // 往後
        [arr[idx], arr[idx+1]] = [arr[idx+1], arr[idx]];
      }
      renderTags();
    }

    function addOption(type) {
      const input = document.getElementById(type === 'clinic' ? 'newClinicInput' : 'newRankInput');
      const val = input.value.trim();
      if (!val) return;
      if (type === 'clinic') clinicsList.push(val);
      else ranksList.push(val);
      input.value = '';
      renderTags();
    }

    function removeOption(type, index) {
      if(type === 'clinic') clinicsList.splice(index, 1);
      else ranksList.splice(index, 1);
      renderTags();
    }

    function saveOptions() {
      apiCall({ action: "updateOptions", clinics: clinicsList, ranks: ranksList, password: currentPwd }, "✅ 選項與順序已儲存！");
    }

    function toggleSys(isOpen) {
      if(!confirm(`確定要${isOpen ? '開放' : '關閉'}系統嗎？`)) return;
      apiCall({ action: "toggleSystem", status: isOpen, password: currentPwd }, null, (data) => alert(data.message));
    }
  </script>
</body>
</html>
