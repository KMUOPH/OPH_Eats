    .text-theme { color: #9b727a !important; }

先為您解答關於圖庫載入的疑問：

### 💡 關於您的疑問：
**2. 開啟 admin.html 時，不會自動去抓圖庫嗎？檔案很多會不會很慢？那什麼時候需要按重新整理？**
* **自動抓取：** 其實在上一版，只要您輸入密碼按下「登入」成功的瞬間，系統**就已經會自動去抓取圖庫了**！
* **會不會很慢或當機？** Google Drive 的 API 效能非常好，即使有 50~100 張菜單，讀取通常也只需要 **1 到 3 秒**。除非檔案超過好幾百個，否則不會有無法讀取的問題。
* **何時需要按「重新整理」？** 只有在一個情況下會用到：如果您（或其他管理員）**直接打開手機的 Google Drive APP 刪除或新增了照片**，因為網頁不會自動知道，這時候才需要按一下「重新整理」讓網頁同步最新狀態。

### 🛠️ 本次介面大升級重點：
1. **目前點餐系統狀態**：標題更新，拔除「目前狀態：」，直接用大大的**「綠底開放訂餐 / 紅底關閉訂餐」**標籤呈現，且切換時不再跳出煩人的提示框！
2. **上傳區與圖庫區（左右雙欄）**：完美分割為左半邊「餐點」、右半邊「飲料」。在手機螢幕上左右並排，直覺且省下大量滑動空間。
3. **紅色垃圾桶 SVG 圖示**：遵照您的指示，徹底捨棄 Emoji，我為您植入了原生的**紅色垃圾桶圖示**，專業度大幅提升。
4. **診次與職級設定（垂直排列 + 自動定位）**：
   * 改為左側診次、右側職級的**垂直清單**。
   * 順序調整改為清晰的「🔼 / 🔽」按鈕。
   * 按鈕底色改為深灰 (`#6c757d`)，加上「展開/收合」。
   * **超貼心功能**：當您點擊展開時，畫面會**自動往上滑動**，把清單完整呈現在您眼前！

                  <div class="col-6">
                    <label class="form-label text-secondary fw-bold">職級清單</label>
                    <div id="rankVerticalList" class="mb-3" style="min-height: 150px;"></div>
                    <div class="input-group input-group-sm">
                      <input type="text" class="form-control fw-bold" id="newRankInput" placeholder="輸入">
                      <button class="btn btn-theme fw-bold" onclick="addOption('rank')">新增</button>
                    </div>
                  </div>
                </div>

                <button class="btn btn-theme w-100 fw-bold mt-4 py-2" onclick="saveOptions()">儲存選單設定</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js](https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js)"></script>
  <script>
    // ⚠️ 請確保這是您最新的 API 網址
    const GAS_API_URL = "[https://script.google.com/macros/s/AKfycbwGOrIyoQ-XUBcn_nExeZuKkuQIvWx6aZhdYhB10qq6HW6uDxCa9tGUA_pwByVC7cSw/exec](https://script.google.com/macros/s/AKfycbwGOrIyoQ-XUBcn_nExeZuKkuQIvWx6aZhdYhB10qq6HW6uDxCa9tGUA_pwByVC7cSw/exec)"; 
    
    let currentPwd = ""; 
    let clinicsList = []; 
    let ranksList = []; 
    let currentDriveFiles = [];
    let isSystemOpen = false;

    // SVG 垃圾桶圖標
    const trashSvg = `<svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.058l-.5-8.5a.5.5 0 0 1 .47-.528M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5m3.5-.5a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528"/></svg>`;

    function showLoading(text) { document.getElementById('overlayText').innerText = text; document.getElementById('overlay').style.display = 'flex'; }
    function hideLoading() { document.getElementById('overlay').style.display = 'none'; }

    function apiCall(payload, successMsg, callback) {
      fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(res => res.json()).then(data => { 
        hideLoading(); 
        if(data.success) { 
          if(successMsg) alert(successMsg); 
          if(callback) callback(data); 
        } else {
          alert("錯誤：" + data.message); 
        }
      })
      .catch(err => { 
        hideLoading(); 
        alert("網路連線錯誤：" + err.message); 
      });
    }

    function login() {
      currentPwd = document.getElementById('adminPwd').value; 
      showLoading("登入驗證中...");
      apiCall({ action: "adminLogin", password: currentPwd }, null, () => {
        document.getElementById('loginSection').style.display = 'none'; 
        document.getElementById('adminPanel').style.display = 'block';
        loadCurrentOptions(); 
        loadDriveFiles(); // 登入後自動抓取圖庫
      });
    }

    function updateStatusUI() {
      const badge = document.getElementById('systemStatusBadge');
      if (isSystemOpen) {
        badge.innerText = "開放訂餐";
        badge.className = "badge bg-success fs-5";
      } else {
        badge.innerText = "關閉訂餐";
        badge.className = "badge bg-danger fs-5";
      }
    }

    function loadCurrentOptions() { 
      apiCall({ action: "getSystemData" }, null, (res) => { 
        clinicsList = res.data.clinics || []; 
        ranksList = res.data.ranks || []; 
        isSystemOpen = res.data.isOpen;
        updateStatusUI();
        renderVerticalLists(); 
      }); 
    }

    function toggleSystemState() { 
      const newState = !isSystemOpen;
      showLoading("設定狀態中..."); 
      apiCall({ action: "toggleSystem", status: newState, password: currentPwd }, null, () => {
        isSystemOpen = newState;
        updateStatusUI();
        // 移除成功提示框，實現靜默切換
      }); 
    }

    function loadDriveFiles() {
      showLoading("讀取圖庫中...");
      apiCall({ action: "getDriveFiles", password: currentPwd }, null, (res) => {
        currentDriveFiles = res.files;
        
        let bentoOptions = '<option value="">-- 選擇餐點 --</option>'; 
        let drinkOptions = '<option value="">-- 選擇飲料 --</option>'; 
        let bentoListHtml = '';
        let drinkListHtml = '';
        
        currentDriveFiles.forEach(f => {
          const opt = `<option value="${f.url}">${f.name}</option>`;
          const fileDiv = `
            <div class="file-item d-flex justify-content-between align-items-center">
              <span class="text-truncate fw-bold text-secondary" style="font-size: 0.8rem; max-width: 75%;" title="${f.name}">${f.name}</span>
              <span class="trash-icon" onclick="deleteMenuFile('${f.id}', '${f.name}')">${trashSvg}</span>
            </div>`;

          if (f.name.startsWith('[餐點]')) {
            bentoOptions += opt;
            bentoListHtml += fileDiv;
          } else if (f.name.startsWith('[飲料]')) {
            drinkOptions += opt;
            drinkListHtml += fileDiv;
          } else { 
            // 舊格式未分類檔案，兩邊都放
            bentoOptions += opt; drinkOptions += opt; 
            bentoListHtml += fileDiv; drinkListHtml += fileDiv;
          }
        });
        
        document.getElementById('bentoSelect').innerHTML = bentoOptions; 
        document.getElementById('drinkSelect').innerHTML = drinkOptions;
        document.getElementById('bentoFileList').innerHTML = bentoListHtml || '<div class="text-muted small text-center py-2">無資料</div>';
        document.getElementById('drinkFileList').innerHTML = drinkListHtml || '<div class="text-muted small text-center py-2">無資料</div>';
      });
    }

    function setMenu(type) {
      const select = document.getElementById(type + 'Select');
      const url = select.value; 
      if(!url) return alert("請先選擇菜單！");
      
      const text = select.options[select.selectedIndex].text;
      // 移除前綴與時間戳記後綴，抓出純店名
      const shopName = text.replace(/^\[.*?\]/, '').replace(/_\d{8}_\d{4}\.jpg$/, '').replace(/_\d+\.jpg$/, '');
      
      showLoading("套用設定中..."); 
      apiCall({ action: "setMenuUrl", menuType: type, url: url, shopName: shopName, password: currentPwd }, "✅ 今日菜單已成功套用！");
    }

    function uploadToLibrary(type) {
      const nameInput = document.getElementById(type === 'bento' ? 'libBentoName' : 'libDrinkName');
      const fileInput = document.getElementById(type === 'bento' ? 'libBentoFile' : 'libDrinkFile');
      
      if (!nameInput.value.trim()) return alert("請輸入店家名稱！");
      if (!fileInput.files[0]) return alert("請選擇圖片！");
      
      const file = fileInput.files[0];
      const prefix = type === 'bento' ? '[餐點]' : '[飲料]';
      const shopName = nameInput.value.trim();
      
      // 產生易讀的時間戳記 (YYYYMMDD_HHmm)
      const now = new Date();
      const timeStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
      const finalFilename = `${prefix}${shopName}_${timeStr}.jpg`;
      
      showLoading("照片壓縮與上傳中...");
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas'); 
          let width = img.width, height = img.height; 
          const MAX_SIZE = 1200;
          
          if (width > height && width > MAX_SIZE) { 
            height *= MAX_SIZE / width; width = MAX_SIZE; 
          } else if (height > MAX_SIZE) { 
            width *= MAX_SIZE / height; height = MAX_SIZE; 
          }
          
          canvas.width = width; 
          canvas.height = height; 
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          
          apiCall(
            { action: "uploadOnly", menuType: type, filename: finalFilename, image: canvas.toDataURL('image/jpeg', 0.8), shopName: shopName, password: currentPwd }, 
            "檔案已成功上傳至圖庫！", 
            () => { 
              fileInput.value = ""; 
              nameInput.value = ""; 
              loadDriveFiles(); 
            }
          );
        }; 
        img.src = e.target.result;
      }; 
      reader.readAsDataURL(file);
    }

    function deleteMenuFile(fileId, fileName) {
      if(!confirm(`確定要從圖庫中刪除「${fileName}」嗎？`)) return; 
      showLoading("刪除檔案中...");
      apiCall({ action: "deleteFile", fileId: fileId, password: currentPwd }, null, () => loadDriveFiles());
    }

    // 垂直列表渲染
    function renderVerticalLists() {
      const buildList = (arr, type) => arr.map((item, i) => `
        <div class="d-flex justify-content-between align-items-center py-1 border-bottom">
          <span class="fw-bold" style="font-size: 0.9rem;">${item}</span>
          <div class="d-flex align-items-center">
            <span class="action-icon" onclick="moveOption('${type}', ${i}, -1)">🔼</span>
            <span class="action-icon" onclick="moveOption('${type}', ${i}, 1)">🔽</span>
            <span class="trash-icon ms-1" onclick="removeOption('${type}', ${i})">${trashSvg}</span>
          </div>
        </div>
      `).join('');
      
      document.getElementById('clinicVerticalList').innerHTML = buildList(clinicsList, 'clinic'); 
      document.getElementById('rankVerticalList').innerHTML = buildList(ranksList, 'rank');
    }

    function moveOption(type, idx, dir) { 
      const arr = type === 'clinic' ? clinicsList : ranksList; 
      if (dir === -1 && idx > 0) {
        [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]]; 
      } else if (dir === 1 && idx < arr.length - 1) {
        [arr[idx], arr[idx+1]] = [arr[idx+1], arr[idx]]; 
      }
      renderVerticalLists(); 
    }

    function addOption(type) { 
      const input = document.getElementById(type === 'clinic' ? 'newClinicInput' : 'newRankInput'); 
      if (!input.value.trim()) return; 
      (type === 'clinic' ? clinicsList : ranksList).push(input.value.trim()); 
      input.value = ''; 
      renderVerticalLists(); 
    }

    function removeOption(type, index) { 
      (type === 'clinic' ? clinicsList : ranksList).splice(index, 1); 
      renderVerticalLists(); 
    }

    function saveOptions() { 
      showLoading("儲存設定中..."); 
      apiCall({ action: "updateOptions", clinics: clinicsList, ranks: ranksList, password: currentPwd }, "選單設定已儲存！", () => {
        const collapseElement = document.getElementById('optionsCollapse');
        const bsCollapse = bootstrap.Collapse.getInstance(collapseElement);
        if(bsCollapse) bsCollapse.hide();
      }); 
    }

    // 貼心功能：當設定選單展開時，自動將畫面平滑往上捲動，避免被鍵盤或螢幕底部擋住
    document.getElementById('optionsCollapse').addEventListener('shown.bs.collapse', function () {
      document.getElementById('optionsToggleBtn').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  </script>
</body>
</html>
